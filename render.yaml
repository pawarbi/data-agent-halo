services:
  - type: web
    name: halo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: HALO_CLIENT_ID
        sync: false
      - key: HALO_TENANT
        sync: false
      - key: HALO_CLIENT_SECRET
        sync: false
      - key: HALO_REDIRECT_URI
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: HALO_MODEL
        value: nvidia/nemotron-3-ultra-550b-a55b:free
      - key: HALO_SESSION_SECRET
        generateValue: true
      # Your agent catalogue as JSON: the contents of agents.json. Keeping it in
      # an env var rather than the repo means your workspace GUIDs are not committed.
      - key: HALO_AGENTS
        sync: false
      # A data agent doing NL->SQL can take a while; the default 300s is usually right.
      - key: HALO_AGENT_TIMEOUT
        value: "300"
