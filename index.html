<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HALO — Live Orchestrator</title>
<style>
  :root{ --bg:#0B0E14; --panel:#111722; --panel2:#0E141E; --line:#1E2937;
    --text:#FFFFFF; --muted:#8A94A6; --dim:#5A6577;
    --green:#92E8A0; --teal:#7FECD9; --blue:#8ECEEF; --salmon:#FFA38A; --idle:#26313F; }
  *{ box-sizing:border-box; } html,body{ margin:0; height:100%; }
  body{ background:radial-gradient(ellipse at 50% -10%, #131b28 0%, var(--bg) 60%);
        color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; overflow:hidden; }
  .wrap{ height:100vh; display:flex; flex-direction:column; padding:18px 22px; }
  .top{ display:flex; align-items:baseline; gap:14px; margin-bottom:6px; }
  .brand{ font-weight:700; font-size:21px; letter-spacing:.14em; } .brand b{ color:var(--teal); }
  .sub{ font-family:'Cascadia Code',monospace; font-size:11.5px; color:var(--muted); letter-spacing:.05em; }
  .who{ margin-left:auto; font-family:'Cascadia Code',monospace; font-size:11.5px; color:var(--dim); }
  .who a{ color:var(--teal); text-decoration:none; }
  .askbar{ display:flex; gap:8px; margin:8px 0 4px; }
  .askbar input{ flex:1; background:var(--panel); border:1px solid var(--line); color:var(--text);
    border-radius:9px; padding:10px 14px; font-size:14px; font-family:'Segoe UI',sans-serif; }
  .askbar input:focus{ outline:none; border-color:var(--teal); }
  .btn{ font-size:13px; font-weight:600; border-radius:9px; border:1px solid var(--line);
    background:var(--teal); color:#06120f; padding:10px 18px; cursor:pointer; }
  .btn:disabled{ opacity:.4; cursor:default; }
  .chips{ display:flex; gap:7px; flex-wrap:wrap; margin-bottom:4px; }
  .chip{ font-size:11.5px; color:var(--muted); background:var(--panel); border:1px solid var(--line);
    border-radius:7px; padding:5px 10px; cursor:pointer; } .chip:hover{ border-color:var(--teal); color:var(--teal); }
  .main{ flex:1; display:grid; grid-template-columns:1.15fr 1fr; gap:14px; margin-top:6px; min-height:0; }
  .stage{ position:relative; border:1px solid var(--line); border-radius:14px; background:var(--panel2); overflow:hidden; }
  svg{ position:absolute; inset:0; width:100%; height:100%; }
  .trace{ border:1px solid var(--line); border-radius:14px; background:var(--panel2); display:flex; flex-direction:column; min-height:0; }
  .traceHead{ padding:11px 16px; border-bottom:1px solid var(--line); font-family:'Cascadia Code',monospace; font-size:11px; letter-spacing:.1em; color:var(--muted); }
  .log{ flex:1; overflow-y:auto; padding:12px 14px; font-family:'Cascadia Code',monospace; font-size:12px; }
  .entry{ border-left:2px solid var(--teal); padding:6px 0 10px 12px; margin-bottom:2px; }
  .entry.done{ border-left-color:var(--green); } .entry.retry{ border-left-color:var(--salmon); } .entry.err{ border-left-color:var(--salmon); }
  .entry .node{ color:var(--teal); font-weight:500; } .entry .body{ color:var(--text); margin-top:4px; line-height:1.5; white-space:pre-wrap; }
  .final{ padding:12px 14px; border-top:1px solid var(--line); font-family:'Segoe UI',sans-serif; font-size:13px; line-height:1.5; display:none; }
  .final.show{ display:block; } .final .lbl{ font-family:'Cascadia Code',monospace; font-size:10px; letter-spacing:.1em; color:var(--green); }
  .gate{ position:fixed; inset:0; background:rgba(8,11,17,.9); display:flex; align-items:center; justify-content:center; z-index:10; }
  .gate .card{ background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:34px 40px; text-align:center; }
  .gate h1{ font-size:24px; letter-spacing:.12em; margin:0 0 6px; } .gate h1 b{ color:var(--teal); }
  .gate p{ color:var(--muted); font-size:13px; margin:0 0 20px; }
  .legend{ position:absolute; top:12px; right:14px; font-family:'Cascadia Code',monospace; font-size:10px; color:var(--muted); text-align:right; line-height:1.7; }
  .legend span{ display:inline-block; width:8px; height:8px; border-radius:50%; margin-left:6px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">HA<b>L</b>O</div>
    <div class="sub">HIERARCHICAL AGENT LOOP ORCHESTRATOR &nbsp;·&nbsp; live</div>
    <div class="who" id="who"></div>
  </div>
  <div class="chips" id="chips"></div>
  <div class="askbar">
    <input id="q" placeholder="Ask across your data agents…" />
    <button class="btn" id="run">▶ Run</button>
  </div>
  <div class="main">
    <div class="stage">
      <svg id="svg" viewBox="0 0 1000 560" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="legend">REASONING PATH
        <span style="background:var(--teal)"></span> active
        <span style="background:var(--green)"></span> done
        <span style="background:var(--salmon)"></span> retry
        <span style="background:var(--idle)"></span> idle</div>
    </div>
    <div class="trace">
      <div class="traceHead">EXECUTION TRACE</div>
      <div class="log" id="log"></div>
      <div class="final" id="final"></div>
    </div>
  </div>
</div>
<div class="gate" id="gate">
  <div class="card">
    <h1>HA<b>L</b>O</h1>
    <p>Sign in with your Microsoft identity to query your data agents.</p>
    <a class="btn" href="/auth/login">Sign in</a>
  </div>
</div>
<script>
// Example questions shown as chips. Edit these to suit your agents.
const EXAMPLES=["How many active subscriptions are there by plan?","What was OEE by plant last month?","Compare subscription growth with production output"];

// The graph is built from whatever agents /api/me reports, so adding an agent in
// halo_core.py is all it takes — no layout to keep in sync here.
let N={}, E=[];
function vkey(agentKey){ return "a_"+agentKey; }
function buildLayout(agentKeys){
  N={ start:{x:500,y:40,r:9,label:"question"}, classify:{x:500,y:120,r:16,label:"classify"},
      synth:{x:500,y:370,r:16,label:"synthesize"}, validate:{x:500,y:460,r:16,label:"validate"},
      answer:{x:500,y:530,r:11,label:"answer"} };
  const n=agentKeys.length;
  const span=Math.min(860,Math.max(0,(n-1)*250)), left=500-span/2, step=n>1?span/(n-1):0;
  agentKeys.forEach((k,i)=>{ N[vkey(k)]={ x:n>1?left+i*step:500, y:250, r:15, label:k,
    size:n>4?10:12 }; });
  E=[["start","classify"]];
  agentKeys.forEach(k=>{ E.push(["classify",vkey(k)]); E.push([vkey(k),"synth"]); });
  E.push(["synth","validate"],["validate","answer"]);
}
buildLayout([]);
const svg=document.getElementById("svg"), NS="http://www.w3.org/2000/svg";
const logEl=document.getElementById("log"), finalEl=document.getElementById("final");
let route=[];
function el(t,a){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;}
function edgeId(a,b){return a+">"+b;}
function curve(a,b){const A=N[a],B=N[b];const mx=(A.x+B.x)/2-170,my=(A.y+B.y)/2;return "M "+A.x+" "+A.y+" Q "+mx+" "+my+" "+B.x+" "+B.y;}
function draw(){ svg.innerHTML="";
  const defs=el("defs"); defs.innerHTML='<filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>'; svg.appendChild(defs);
  svg.appendChild(el("path",{d:curve("validate","synth"),fill:"none",stroke:"var(--idle)","stroke-width":1.5,"stroke-dasharray":"5 6",id:"redge"}));
  const rl=el("text",{x:305,y:415,fill:"var(--dim)","font-size":10,"font-family":"Cascadia Code, monospace","text-anchor":"middle"}); rl.textContent="retry ↻"; svg.appendChild(rl);
  E.forEach(p=>{const A=N[p[0]],B=N[p[1]]; svg.appendChild(el("line",{x1:A.x,y1:A.y,x2:B.x,y2:B.y,stroke:"var(--idle)","stroke-width":1.5,id:"e_"+edgeId(p[0],p[1])}));});
  for(const k in N){const n=N[k];const g=el("g",{});
    g.appendChild(el("circle",{cx:n.x,cy:n.y,r:n.r,fill:"var(--panel)",stroke:"var(--idle)","stroke-width":2,id:"c_"+k}));
    const t=el("text",{x:n.x,y:n.y+n.r+15,fill:"var(--muted)","font-size":n.size||12,"font-family":"Cascadia Code, monospace","text-anchor":"middle",id:"t_"+k}); t.textContent=n.label; g.appendChild(t); svg.appendChild(g);}
}
function setNode(k,s){const c=document.getElementById("c_"+k),t=document.getElementById("t_"+k);if(!c)return;
  const m={idle:["var(--panel)","var(--idle)","var(--muted)",""],active:["#0f2b28","var(--teal)","var(--teal)","url(#glow)"],done:["#122417","var(--green)","var(--green)",""],retry:["#2a1712","var(--salmon)","var(--salmon)","url(#glow)"]};
  const a=m[s];c.setAttribute("fill",a[0]);c.setAttribute("stroke",a[1]);c.setAttribute("filter",a[3]);c.setAttribute("r",N[k].r+((s==="active"||s==="retry")?2:0));t.setAttribute("fill",a[2]);}
function setEdge(id,s){const e=document.getElementById("e_"+id);if(!e)return;const m={idle:["var(--idle)",1.5],active:["var(--teal)",3],done:["var(--green)",2],retry:["var(--salmon)",3]};const a=m[s];e.setAttribute("stroke",a[0]);e.setAttribute("stroke-width",a[1]);}
function reset(){draw(); for(const k in N)setNode(k,"idle"); logEl.innerHTML=""; finalEl.className="final"; finalEl.innerHTML=""; route=[];}
function addTrace(cls,node,body){const e=document.createElement("div");e.className="entry "+(cls||"");
  e.innerHTML='<span class="node">▸ '+node+'</span><div class="body">'+body+'</div>';
  logEl.querySelectorAll(".entry").forEach(x=>{x.classList.remove("retry");if(!x.classList.contains("err"))x.classList.add("done");});
  logEl.appendChild(e); logEl.scrollTop=logEl.scrollHeight;}
function activate(nodeKeys,retry){ // demote others
  for(const k in N){ /* leave done as-is via edges */ }
  nodeKeys.forEach(k=>setNode(k,retry?"retry":"active"));
}
function esc(s){return (s||"").replace(/</g,"&lt;");}

function handleEvent(d){
  const retry = d.verdict==="retry";
  if(d.node==="classify"){ route=d.route||[]; activate(["classify"]); setEdge("start>classify","done");
    route.forEach(k=>setEdge("classify>"+vkey(k),"active"));
    addTrace("","classify", '<span style="color:var(--muted)">route:</span> '+JSON.stringify(route)); }
  else if(d.node==="fan_out"){ const vks=route.map(vkey); activate(vks);
    vks.forEach(k=>setEdge(k+">synth","active"));
    let b='<span style="color:var(--muted)">calling '+route.length+' agent(s) in parallel · as user</span>';
    if(d.results) d.results.forEach(r=> b+='\n<span style="color:var(--blue)">'+esc(r.agent)+':</span> '+esc(r.preview));
    addTrace("","fan-out", b); }
  else if(d.node==="synthesize"){ activate(["synth"]); setEdge("synth>validate","active");
    addTrace("","synthesize", '<span style="color:var(--muted)">merged result(s)</span>'); }
  else if(d.node==="validate"){ activate(["validate"],retry);
    const re=document.getElementById("redge");
    if(retry){ if(re)re.setAttribute("stroke","var(--salmon)"); addTrace("retry","validate", '<span style="color:var(--salmon)">retry</span> — '+esc(d.critique||"")); }
    else { setEdge("validate>answer","active"); addTrace("","validate", '<span style="color:var(--green)">pass</span>'); } }
  else if(d.node==="done"){ setNode("answer","done"); for(const k in N){const c=document.getElementById("c_"+k); if(c&&c.getAttribute("stroke")==="var(--teal)")setNode(k,"done");}
    if(d.answer){ finalEl.innerHTML='<div class="lbl">FINAL ANSWER</div>'+esc(d.answer); finalEl.classList.add("show"); } }
  else if(d.node==="error"){ addTrace("err","error", '<span style="color:var(--salmon)">'+esc(d.trace)+'</span>'); }
  else if(d.trace){ addTrace("", d.node||"step", esc(d.trace)); }
}

let es=null;
function run(){
  const q=document.getElementById("q").value.trim(); if(!q) return;
  reset(); document.getElementById("run").disabled=true;
  if(es) es.close();
  es=new EventSource("/api/ask?q="+encodeURIComponent(q)+"&thread=web-"+Date.now());
  es.onmessage=(ev)=>{ const d=JSON.parse(ev.data); handleEvent(d);
    if(d.node==="done"||d.node==="error"){ es.close(); document.getElementById("run").disabled=false; } };
  es.onerror=()=>{ es.close(); document.getElementById("run").disabled=false; };
}
document.getElementById("run").addEventListener("click",run);
document.getElementById("q").addEventListener("keydown",e=>{ if(e.key==="Enter") run(); });

// boot: check auth, lay the graph out around the agents this server actually has
fetch("/api/me").then(r=>r.json()).then(m=>{
  if(m.signed_in){ document.getElementById("gate").style.display="none";
    document.getElementById("who").innerHTML="● "+ (m.who||"signed in") +" &nbsp;·&nbsp; <a href='/auth/logout'>sign out</a>"; }
  buildLayout(Object.keys(m.agents||{}));
  const chips=document.getElementById("chips");
  EXAMPLES.forEach(t=>{const c=document.createElement("div");c.className="chip";c.textContent=t;
    c.onclick=()=>{document.getElementById("q").value=t; run();}; chips.appendChild(c);});
  reset();
}).catch(()=>draw());
</script>
</body>
</html>
